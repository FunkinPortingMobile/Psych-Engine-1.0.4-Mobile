# This is a basic workflow to help you get started with Actions

name: Main Build

env:
  HAXE_VER: 4.3.7

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install Libraries
        run: |
          chmod +x ./setup/mobile.sh
          sh ./setup/mobile.sh
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          haxelib run lime rebuild hxcpp --quiet

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
          
      - name: Install Libraries
        run: |
         chmod +x ./setup/mobile.sh
         sh ./setup/mobile.sh
         haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
         haxelib remove lime
         haxelib git lime https://github.com/DeveloperPorting-Stuff/LimeFunkinCrew main --quiet
         haxelib run lime rebuild hxcpp

      - name: Compile
        run: haxelib run lime build ios -nosign

      - name: Making ipa file
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/PsychMobile1.0.4.app
          ldid -S../../../PsychMobile1.0.4/PsychMobile1.0.4.entitlements PsychMobile1.0.4
          cd ..
          mkdir Payload
          mv PsychMobile1.0.4.app Payload
          zip -r PsychMobile1.0.4.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
          
  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6.0.2

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
          haxelib run lime rebuild hxcpp --quiet
      - name: Compile
        run: haxelib run lime build linux
      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-Linux
          path: 'export/release/linux/bin'
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6.0.2

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          .\"setup/windows.bat"
          haxelib run lime rebuild hxcpp --quiet
        shell: cmd
      - name: Compile
        run: haxelib run lime build windows
      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-Windows
          path: export/release/windows/bin
  mac:
    name: Build MacOS
    runs-on: macos-15

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6.0.2

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VER }}
          
      - name: Authenticate Git for Private Repositories
        run: git config --global url."https://${{ secrets.ORG_PAT_TOKEN }}@github.com/".insteadOf "git@github.com:"
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/FunkinCrew/hxcpp 5932340d095a7eea8635fe4d1355f1c0efd0b3c2
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh
          haxelib run lime rebuild hxcpp --quiet
      - name: Compile
        run: haxelib run lime build mac
      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PsychEngine-MacOS
          path: export/release/macos/bin
